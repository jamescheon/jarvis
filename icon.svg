<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a2e"/>
      <stop offset="100%" stop-color="#000308"/>
    </radialGradient>
    <radialGradient id="orb" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a0f0ff"/>
      <stop offset="25%" stop-color="#00d4ff"/>
      <stop offset="60%" stop-color="#0066aa"/>
      <stop offset="100%" stop-color="#001a33"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="140" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.35"/>
  <text x="256" y="440" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="bold" fill="#7ee8fa" letter-spacing="6">JARVIS</text>
</svg>
