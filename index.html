<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00d4ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>J.A.R.V.I.S.</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: radial-gradient(ellipse at center, #001a2e 0%, #000308 100%);
    color: #7ee8fa;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 40px;
    min-height: 100vh;
  }
  h1 {
    font-family: 'Consolas', 'Courier New', monospace;
    letter-spacing: 12px;
    font-size: 22px;
    color: #7ee8fa;
    text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
    margin-bottom: 8px;
  }
  .subtitle {
    font-family: 'Consolas', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: #4a90a4;
    margin-bottom: 30px;
  }
  #orb-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
  }
  #orb {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7ee8fa 0%, #00d4ff 25%, #0066aa 60%, #001a33 100%);
    box-shadow:
      0 0 60px rgba(0, 212, 255, 0.6),
      inset 0 0 40px rgba(0, 100, 200, 0.4);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  #orb::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 70%, rgba(255,255,255,0.15), transparent 50%);
    border-radius: 50%;
  }
  #orb.listening {
    animation: listen-pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 80px #00d4ff, 0 0 120px rgba(0, 212, 255, 0.5);
  }
  #orb.thinking {
    background: radial-gradient(circle at 30% 30%, #ffcc80 0%, #ffa500 30%, #663300 100%);
    animation: think-spin 1.2s linear infinite;
    box-shadow: 0 0 80px rgba(255, 165, 0, 0.7);
  }
  #orb.speaking {
    background: radial-gradient(circle at 30% 30%, #a0f0ff 0%, #00e5ff 25%, #007799 100%);
    animation: speak-pulse 0.35s ease-in-out infinite;
  }
  @keyframes listen-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes speak-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes think-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0, 212, 255, 0.3);
    pointer-events: none;
  }
  .ring.r1 { width: 210px; height: 210px; animation: ring-rot 8s linear infinite; }
  .ring.r2 { width: 240px; height: 240px; animation: ring-rot 12s linear infinite reverse; border-style: dashed; }
  @keyframes ring-rot {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  #status {
    font-family: 'Consolas', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    margin-top: 24px;
    min-height: 22px;
    color: #7ee8fa;
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }
  .button-row {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #toggle {
    background: transparent;
    color: #7ee8fa;
    border: 1px solid #00d4ff;
    padding: 12px 32px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
  }
  #toggle:hover {
    background: rgba(0, 212, 255, 0.1);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  }
  #toggle.on {
    color: #ff6b6b;
    border-color: #ff6b6b;
    text-shadow: 0 0 6px rgba(255, 107, 107, 0.5);
  }
  #toggle.on:hover {
    background: rgba(255, 107, 107, 0.1);
    box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
  }
  #wake-toggle {
    background: transparent;
    color: #6b95a4;
    border: 1px solid #3a6a7a;
    padding: 12px 22px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #wake-toggle:hover {
    background: rgba(0, 212, 255, 0.05);
  }
  #wake-toggle.on {
    color: #7dffb3;
    border-color: #7dffb3;
    text-shadow: 0 0 6px rgba(125, 255, 179, 0.5);
    box-shadow: 0 0 15px rgba(125, 255, 179, 0.2);
  }
  #log {
    width: 100%;
    max-width: 640px;
    margin-top: 30px;
    font-family: 'Consolas', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .msg {
    margin: 10px 0;
    padding: 10px 16px;
    border-radius: 4px;
    animation: fade-in 0.3s ease-out;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    background: rgba(0, 212, 255, 0.08);
    border-left: 2px solid #00d4ff;
    color: #a0e8ff;
  }
  .msg.jarvis {
    background: rgba(255, 165, 0, 0.06);
    border-left: 2px solid #ffa500;
    color: #ffcc80;
  }
  .msg .who {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 4px;
    font-family: 'Consolas', monospace;
  }
  #hint {
    font-family: 'Consolas', monospace;
    font-size: 11px;
    color: #4a90a4;
    margin-top: 12px;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">JUST · A · RATHER · VERY · INTELLIGENT · SYSTEM</div>

<div id="orb-wrap">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div id="orb"></div>
</div>

<div id="status">시스템 대기 중</div>
<div class="button-row">
  <button id="toggle">SYSTEM ONLINE</button>
  <button id="wake-toggle">🎙️ 웨이크워드 OFF</button>
</div>
<div id="hint">
  ※ Chrome / Edge 브라우저에서 최적 동작<br>
  ※ 마이크 권한을 허용해주세요<br>
  ※ 웨이크워드 ON: "자비스" 라고 부르면 응답, 답변 후 10초간은 다시 안 불러도 이어서 질문 가능<br>
  ※ "컴퓨터, OOO 해줘" : 이 컴퓨터에서 실제 작업 즉시 실행 후 결과 보고 (로컬 실행 시에만 동작)<br>
  ※ "OOO 검색해줘" : 확인 없이 바로 네이버 검색 결과 열기
</div>

<div id="log"></div>

<script>
(() => {
  const orb = document.getElementById('orb');
  const statusEl = document.getElementById('status');
  const log = document.getElementById('log');
  const toggle = document.getElementById('toggle');
  const wakeToggle = document.getElementById('wake-toggle');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    statusEl.textContent = '이 브라우저는 음성 인식 미지원';
    toggle.disabled = true;
    toggle.style.opacity = 0.4;
    wakeToggle.disabled = true;
    wakeToggle.style.opacity = 0.4;
  }

  let recognition = null;
  let isActive = false;
  let wakeMode = false;
  let awaitingCommand = false;
  let commandTimeout = null;
  let processing = false;
  let wakeLock = null;
  let audioCtx = null;
  let messages = [];

  const WAKE_RE = /(자비스|재비스|jarvis)\s*[야가는]?[,.!?\s]*(.*)/i;
  const SHUTDOWN_RE = /(잘\s*자|잘가|시스템\s*종료|자비스\s*(꺼|끝|안녕))/i;
  const PC_TASK_RE = /^(컴퓨터|피씨|pc)\s*[,야아]?\s*(.+)/i;

  try {
    wakeMode = localStorage.getItem('jarvis-wake') === '1';
  } catch(_) {}
  updateWakeUI();

  function setState(cls, text) {
    orb.className = cls || '';
    if (text !== undefined) statusEl.textContent = text;
  }

  function addLog(who, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = `<div class="who">${who === 'user' ? '선생님' : 'J.A.R.V.I.S.'}</div>${escapeHtml(text)}`;
    log.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Known male neural voice names, by language - browsers/OSes expose
  // whatever voice packs are installed under names like "Microsoft InJoon
  // Online (Natural) - Korean (Korea)", so match on a substring.
  const MALE_VOICE_HINTS = {
    ko: ['injoon', 'bongjin', 'gookmin', 'hyunsu'],
    en: ['guy', 'davis', 'tony', 'david', 'male'],
  };

  function pickVoice(langPrefix) {
    const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(langPrefix));
    const hints = MALE_VOICE_HINTS[langPrefix] || [];
    const isMale = (v) => hints.some(h => v.name.toLowerCase().includes(h));
    const isNatural = (v) => /neural|natural/i.test(v.name);
    return voices.find(v => isMale(v) && isNatural(v))
        || voices.find(v => isMale(v))
        || voices.find(isNatural)
        || voices[0]
        || null;
  }

  // Deaf window: while the mic is reopening after TTS, real acoustic echo
  // of our own voice (phone speaker bleeding into the phone mic) can come
  // back through speech recognition as *different*, mis-transcribed text -
  // so matching against what we said is unreliable. Instead, just ignore
  // everything heard for a fixed period after we finish speaking.
  let micDeafUntil = 0;

  function speak(text, lang = 'ko-KR', postReopenDeafMs = 1200) {
    return new Promise((resolve) => {
      setState('speaking', '응답 중');
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 1.05;
      utter.pitch = 0.85;
      utter.volume = 1.0;
      const v = pickVoice(lang.split('-')[0].toLowerCase());
      if (v) utter.voice = v;
      const finish = () => {
        // Mic stays off another 700ms, then ignores results for
        // postReopenDeafMs more once it reopens - covers speaker/room echo
        // decay on phones. Callers expecting an immediate reply (like a
        // yes/no confirmation) can pass a much smaller value so a quick
        // answer doesn't get swallowed.
        micDeafUntil = Date.now() + 700 + postReopenDeafMs;
        setTimeout(resolve, 700);
      };
      utter.onend = finish;
      utter.onerror = finish;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    });
  }

  function beep(freq = 880, ms = 120) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + ms / 1000);
      osc.stop(audioCtx.currentTime + ms / 1000);
    } catch(_) {}
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(_) {}
  }

  function releaseWakeLock() {
    if (wakeLock) {
      try { wakeLock.release(); } catch(_) {}
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (isActive && document.visibilityState === 'visible' && !wakeLock) {
      requestWakeLock();
    }
  });

  function idleStatus() {
    if (awaitingCommand) return '명령을 말씀하세요';
    return wakeMode ? '"자비스" 라고 불러주세요' : '듣고 있습니다';
  }

  const APP_LINKS = {
    '유튜브': { scheme: 'vnd.youtube://', web: 'https://www.youtube.com' },
    '스포티파이': { scheme: 'spotify://', web: 'https://open.spotify.com' },
    '카카오톡': { scheme: 'kakaotalk://', web: 'https://www.kakaocorp.com' },
    '인스타그램': { scheme: 'instagram://app', web: 'https://www.instagram.com' },
    '넷플릭스': { scheme: 'nflx://', web: 'https://www.netflix.com' },
    '지도': { scheme: 'nmap://', web: 'https://map.naver.com' },
    '네이버지도': { scheme: 'nmap://', web: 'https://map.naver.com' },
    '네이버': { scheme: null, web: 'https://www.naver.com' },
  };
  const OPEN_APP_RE = /(네이버\s*지도|유튜브|스포티파이|카카오톡|인스타그램|넷플릭스|지도|네이버)\s*(?:좀)?\s*(?:열어|틀어|실행해|켜)\s*(?:줘|줄래|주세요)?\s*$/;

  // Chrome silently blocks window.open() when it isn't called from a direct
  // click/tap - a voice command doesn't count, so this fails constantly
  // unless the user has explicitly allowed pop-ups for this site. Chrome
  // returns null instead of a window handle when it blocks one; use that to
  // tell the truth instead of claiming success.
  function openWindow(url) {
    return !!window.open(url, '_blank');
  }

  function openApp(name) {
    const target = APP_LINKS[name];
    if (!target) return 'not_found';
    if (!target.scheme) {
      return openWindow(target.web) ? 'ok' : 'blocked';
    }
    const fallback = setTimeout(() => {
      if (document.visibilityState === 'visible') window.open(target.web, '_blank');
    }, 1200);
    document.addEventListener('visibilitychange', function onVis() {
      if (document.visibilityState === 'hidden') {
        clearTimeout(fallback);
        document.removeEventListener('visibilitychange', onVis);
      }
    });
    window.location.href = target.scheme;
    return 'ok';
  }

  // After finishing a response, don't require "자비스" again right away -
  // stay listening for a follow-up like a real conversation, the same way
  // the initial "Yes, sir?" prompt already does. Only in wake mode; manual
  // mode already treats every utterance as a command with no wake word.
  function finishTurn() {
    processing = false;
    if (!isActive) return;
    if (wakeMode) {
      awaitingCommand = true;
      clearTimeout(commandTimeout);
      commandTimeout = setTimeout(() => {
        awaitingCommand = false;
        if (isActive) setState('listening', idleStatus());
      }, 10000);
    }
    startListening();
  }

  async function tryAppCommand(text) {
    const m = text.match(OPEN_APP_RE);
    if (!m) return false;
    const name = m[1].replace(/\s+/g, '');
    const result = openApp(name);
    if (result === 'not_found') return false;
    processing = true;
    if (result === 'blocked') {
      const msg = '팝업이 차단돼서 열지 못했습니다. 크롬 설정에서 팝업을 허용해주세요.';
      addLog('jarvis', msg);
      await speak(msg);
    } else {
      addLog('jarvis', `${name} 실행합니다, 선생님.`);
      await speak(`${name} 실행합니다, 선생님.`);
    }
    finishTurn();
    return true;
  }

  // Plain web search - fast path, no confirmation, no Claude Code agent.
  // Default engine is Naver; strips an optional site mention ("네이버에서",
  // "크롬에서" etc) so people don't need to name a browser/site at all.
  const SEARCH_RE = /^(.+?)\s*(?:검색|찾아)\s*(?:해\s*줘|해\s*줄래|해\s*봐|좀|줘|봐)?\s*$/i;
  const SITE_MENTION_RE = /^(바탕\s*화면\s*)?(네이버|구글|크롬)\s*(에서|으로|로)?\s*|\s*(네이버|구글|크롬)\s*(에서|으로|로)?\s*$/gi;

  function cleanSearchKeyword(s) {
    return s.replace(SITE_MENTION_RE, '').trim();
  }

  async function trySearchCommand(text) {
    const m = text.match(SEARCH_RE);
    if (!m) return false;
    const keyword = cleanSearchKeyword(m[1]);
    if (!keyword) return false;
    const opened = openWindow('https://search.naver.com/search.naver?query=' + encodeURIComponent(keyword));
    processing = true;
    if (opened) {
      addLog('jarvis', `"${keyword}" 검색 결과를 열었습니다.`);
      await speak(`${keyword} 검색 결과를 열었습니다.`);
    } else {
      const msg = '팝업이 차단돼서 검색 결과를 열지 못했습니다. 크롬 설정에서 팝업을 허용해주세요.';
      addLog('jarvis', msg);
      await speak(msg);
    }
    finishTurn();
    return true;
  }

  async function runPcTaskFlow(instruction) {
    // No confirmation step - execute immediately and report the result
    // when done (user explicitly asked to drop the confirm-first safety
    // guard that used to run here).
    processing = true;
    addLog('jarvis', '작업을 시작합니다, 대표님.');
    await speak('작업을 시작합니다, 대표님.');
    try {
      const r = await fetch('/api/pc-task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instruction }),
      });
      const data = await r.json();
      const result = data.result || data.error || '작업을 완료했습니다.';
      addLog('jarvis', result);
      await speak(result);
    } catch (e) {
      const err = '작업 실행 중 오류가 발생했습니다. 이 컴퓨터에서 로컬로 실행 중인지 확인해주세요.';
      addLog('jarvis', err);
      await speak(err);
    }
    finishTurn();
  }

  async function tryPcTask(text) {
    const m = text.match(PC_TASK_RE);
    if (!m) return false;
    const instruction = m[2].trim();
    if (!instruction) return false;
    abortRecognition();
    await runPcTaskFlow(instruction);
    return true;
  }

  async function handleCommand(userText) {
    if (await tryAppCommand(userText)) return;
    if (await trySearchCommand(userText)) return;
    if (await tryPcTask(userText)) return;
    await sendToClaude(userText);
  }

  async function sendToClaude(userText) {
    processing = true;
    setState('thinking', '처리 중');
    messages.push({ role: 'user', content: userText });
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      if (data.action === 'pc_task') {
        // Claude decided this needs real local work, not a spoken answer -
        // drop it from the chat history and hand off to the confirm flow
        // instead (same one the "컴퓨터, ..." shortcut uses).
        messages.pop();
        processing = false;
        await runPcTaskFlow(data.instruction);
        return;
      }
      const reply = data.reply;
      messages.push({ role: 'assistant', content: reply });
      addLog('jarvis', reply);
      await speak(reply);
    } catch (e) {
      const err = '죄송합니다 선생님, 시스템에 오류가 발생했습니다.';
      addLog('jarvis', err + ' (' + e.message + ')');
      await speak(err);
    }
    finishTurn();
  }

  function abortRecognition() {
    if (recognition) {
      try { recognition.abort(); } catch(_) {}
      recognition = null;
    }
  }

  function startListening() {
    if (!SR || !isActive || processing) return;
    abortRecognition();
    try {
      recognition = new SR();
      recognition.lang = 'ko-KR';
      recognition.continuous = wakeMode;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setState('listening', idleStatus());

      recognition.onresult = async (e) => {
        let text = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            text = e.results[i][0].transcript.trim();
          }
        }
        if (!text) return;

        // Ignore anything heard while still inside the post-TTS deaf window
        // (see speak()) - this is almost always our own speaker echo
        if (Date.now() < micDeafUntil) return;

        // Shutdown: works in any mode
        if (SHUTDOWN_RE.test(text)) {
          addLog('user', text);
          processing = true;
          abortRecognition();
          await speak('네, 편히 쉬십시오 선생님.');
          stopSystem();
          return;
        }

        // Manual mode: every utterance is a command
        if (!wakeMode) {
          addLog('user', text);
          abortRecognition();
          await handleCommand(text);
          return;
        }

        // Wake mode
        if (awaitingCommand) {
          clearTimeout(commandTimeout);
          awaitingCommand = false;
          addLog('user', text);
          abortRecognition();
          await handleCommand(text);
          return;
        }

        // Look for wake word
        const m = text.match(WAKE_RE);
        if (!m) return; // ignore, keep listening

        beep(880, 120);
        addLog('user', text);
        const inlineCommand = (m[2] || '').trim();

        if (inlineCommand) {
          abortRecognition();
          await handleCommand(inlineCommand);
        } else {
          processing = true;
          abortRecognition();
          addLog('jarvis', 'Yes, sir?');
          await speak('Yes, sir?', 'en-US');
          awaitingCommand = true;
          commandTimeout = setTimeout(() => {
            awaitingCommand = false;
            if (isActive) setState('listening', idleStatus());
          }, 8000);
          processing = false;
          startListening();
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          setState('', '마이크 권한이 필요합니다');
          stopSystem();
        }
        // other errors (no-speech, network, aborted, audio-capture) are
        // recoverable — onend fires right after and restarts listening
      };

      recognition.onend = () => {
        // Mobile browsers auto-stop the session after a short silence
        // (much sooner than desktop), so this fires constantly — always
        // clear the stale instance and restart if the system is still on.
        recognition = null;
        setTimeout(() => {
          if (isActive && !processing && !recognition) startListening();
        }, 300);
      };

      recognition.start();
    } catch (err) {
      setState('', '음성 인식 시작 실패');
    }
  }

  function stopSystem() {
    isActive = false;
    processing = false;
    awaitingCommand = false;
    clearTimeout(commandTimeout);
    toggle.textContent = 'SYSTEM ONLINE';
    toggle.classList.remove('on');
    abortRecognition();
    speechSynthesis.cancel();
    releaseWakeLock();
    setState('', '시스템 오프라인');
  }

  toggle.addEventListener('click', async () => {
    if (!isActive) {
      isActive = true;
      toggle.textContent = 'SYSTEM OFFLINE';
      toggle.classList.add('on');
      requestWakeLock();
      try { beep(400, 30); } catch(_) {}  // warm up audio context
      // Deliberately avoid saying the wake word here - the mic starts
      // listening right after this plays, so any echo of our own voice
      // saying "자비스" risks immediately re-triggering itself.
      const greeting = wakeMode
        ? '안녕하세요 대표님. 대기 모드입니다. 불러주시면 응답하겠습니다.'
        : '안녕하세요 대표님. 무엇을 도와드릴까요.';
      addLog('jarvis', greeting);
      await speak(greeting);
      startListening();
    } else {
      stopSystem();
    }
  });

  wakeToggle.addEventListener('click', () => {
    wakeMode = !wakeMode;
    try { localStorage.setItem('jarvis-wake', wakeMode ? '1' : '0'); } catch(_) {}
    updateWakeUI();
    awaitingCommand = false;
    clearTimeout(commandTimeout);
    if (isActive) {
      abortRecognition();
      setTimeout(startListening, 200);
    }
  });

  function updateWakeUI() {
    if (wakeMode) {
      wakeToggle.textContent = '🎙️ 웨이크워드 ON';
      wakeToggle.classList.add('on');
    } else {
      wakeToggle.textContent = '🎙️ 웨이크워드 OFF';
      wakeToggle.classList.remove('on');
    }
  }

  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // ?auto=1 - launched from a startup script: force wake mode and start
  // the system automatically. Still needs mic permission already granted
  // from an earlier manual run (browsers won't silently prompt on load).
  if (new URLSearchParams(location.search).get('auto') === '1') {
    if (!wakeMode) {
      wakeMode = true;
      try { localStorage.setItem('jarvis-wake', '1'); } catch(_) {}
      updateWakeUI();
    }
    setTimeout(() => toggle.click(), 300);
  }
})();
</script>
</body>
</html>
